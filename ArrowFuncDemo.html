<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arrow Function Demo</title>
</head>
<body>

    <h2>Arrow Function Example</h2>

    <script>
        // Arrow function to check odd or even
        const checkOddEven = (number) => {
            if (number % 2 === 0) {
                console.log(number + " is Even");
            } else {
                console.log(number + " is Odd");
            }
        };

        // Testing the arrow function
        checkOddEven(10);// Even
        checkOddEven(7);// Odd
        checkOddEven(25);// Odd
        

        // Arrow function to find square of a number
        const findSquare = (num) => {
            return num * num;
        };

        // Testing the arrow function
        console.log(findSquare(5));   // 25
        console.log(findSquare(8));   // 64
        console.log(findSquare(12));  // 144

        /*Arrow functions are used for shorter syntax and they do not have their own 'this' context 
        which means they inherit 'this' from the parent scope. it is useful in scenarios like event handling and callbacks.
        moreover, they cannot be used as constructors and do not have the 'arguments' object.
        By using arrow functions, we can write more concise and readable code.
        */

    </script>

</body>
</html>
