<!--taken almost the same code as fetch api demo as there is an implementation of template literals in that demo-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Template Literals Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .card {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h2>Users Data (Template Literals)</h2>
    <button onclick="fetchUsers()">Fetch Users</button>

    <div id="output"></div>

    <script>
        function fetchUsers() {
            fetch("https://jsonplaceholder.typicode.com/users")
                .then(response => response.json())
                .then(users => {

                    let html = "";
// Using template literals to create user cards
// (`) this allows multi-line strings and embedding expressions using ${} and variables directly within the string.
                    users.forEach(user => {
                        html += ` 
                            <div class="card">
                                <h3>${user.name}</h3>
                                <p>Email: ${user.email}</p>
                                <p>Phone: ${user.phone}</p>
                                <p>City: ${user.address.city}</p>
                            </div>
                        `;
                    });

                    document.getElementById("output").innerHTML = html;
                })
                .catch(error => {
                    console.log("Error:", error);
                });
        }
    </script>

</body>
</html>
